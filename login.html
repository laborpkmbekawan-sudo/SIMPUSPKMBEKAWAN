<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SIMPUS UPTD Puskesmas Bekawan</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <h1>SIMPUS</h1>
    <p class="subtitle" style="font-weight:700; letter-spacing:0.5px;">UPTD PUSKESMAS BEKAWAN</p>
    <p class="subtitle" style="margin-bottom:24px;">Sistem Informasi Manajemen Puskesmas</p>

    <div id="msgBox"></div>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required placeholder="nama@puskesmas.id">

      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">

      <button type="submit" class="btn-primary" style="width:100%; margin-top:8px;">Masuk</button>
    </form>
  </div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msgBox = document.getElementById("msgBox");
  msgBox.innerHTML = "";

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msgBox.innerHTML = `<div class="msg msg-error">Login gagal: ${error.message}</div>`;
    return;
  }

  window.location.href = "index.html";
});

// Kalau sudah login, langsung ke dashboard
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = "index.html";
})();
</script>

</body>
</html>
